description: Trocafone is a Brazilian e-commerce company specializing in refurbished and pre-owned
  smartphones and consumer electronics sold with warranty. Operating primarily in Brazil on the VTEX
  commerce platform, it runs a consumer marketplace for certified semi-new iPhones, Samsung, Motorola
  and other devices, a trade-in program ("Venda seu aparelho") that buys used devices from consumers,
  and a Reparofone device-repair service. Backed by 500 Global, the company is tracked in the API
  Evangelist network as a company profile; as of this enrichment pass it publishes no public developer
  or API surface.
